# nginx для svm-landing. Положите в /etc/nginx/sites-available/svm-landing,
# затем: ln -s в sites-enabled, nginx -t, systemctl reload nginx.
# Замените server_name на ваш домен/поддомен (или _ для доступа по IP).

server {
    listen 80;
    server_name test.example.com;  # ← ваш поддомен (или _ для теста по IP)

    # Лимит размера загружаемого фото (исходник до сжатия на клиенте).
    client_max_body_size 25m;

    # Загруженные через админку фото отдаём напрямую с диска с кэшем.
    # Картинки оптимизированы в WebP при загрузке (images.unoptimized=true),
    # поэтому next/image их не пережимает — кэшируем агрессивно.
    location /uploads/ {
        alias /var/www/svm-landing/public/uploads/;  # ← путь к проекту на сервере
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Всё остальное — на Next.js (PM2, порт 3000).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS (рекомендуется): после установки сертификата через certbot
# (sudo certbot --nginx -d test.example.com) этот блок certbot создаст сам,
# а в .env.production уберите ALLOW_INSECURE_COOKIES.
